name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.4
      - run: ruff check api worker tests_e2e scripts benchmarks
      - run: ruff format --check api worker tests_e2e scripts benchmarks

  api:
    name: API tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voix
          POSTGRES_PASSWORD: voix
          POSTGRES_DB: voix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voix -d voix_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_URL: postgresql+psycopg://voix:voix@localhost:5432/voix_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then export TEST_DATABASE_URL="$PG_URL"; fi
          python -m pytest -p no:cacheprovider

  worker:
    name: Worker tests (mock engine, ffmpeg)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -p no:cacheprovider

  e2e:
    name: End-to-end (API + queue + worker) and benchmark metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            worker/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r api/requirements-dev.txt -r worker/requirements.txt
      - run: python -m pytest tests_e2e benchmarks -p no:cacheprovider

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voix-api ./api
      - run: docker build -t voix-worker ./worker
      - run: docker build -t voix-web ./frontend
