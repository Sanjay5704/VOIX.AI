# Local development stack.
#
#   docker compose up -d postgres            # just the database (for native API/worker + tests)
#   docker compose up --build                # postgres + api + web
#   docker compose --profile worker up       # + a CPU mock worker (no GPU needed)
#
# The real GPU worker runs natively on Windows:  see docs/RUNNING.md
#
# Postgres is published on 5433 to avoid clashing with a local install on 5432.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voix
      POSTGRES_PASSWORD: voix
      POSTGRES_DB: voix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voix -d voix"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://voix:voix@postgres:5432/voix
      LOCAL_STORAGE_DIR: /app/data/storage
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-insecure-worker-token}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      ENABLED_ENGINES: ${ENABLED_ENGINES:-kokoro,xtts,mock}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/data/storage

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""  # same origin: nginx proxies /v1 to the api service
    depends_on:
      - api
    ports:
      - "3000:80"

  worker:
    profiles: ["worker"]
    build: ./worker
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-insecure-worker-token}
      WORKER_NAME: docker-mock-worker
      ENGINES: mock

volumes:
  pgdata:
  storage:
