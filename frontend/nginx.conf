server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Serve the React SPA, falling back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container/service so the browser only
    # ever talks to a single origin in production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
